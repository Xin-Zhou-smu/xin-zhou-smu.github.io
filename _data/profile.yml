research:
  - title: Agentic Software Engineering
    icon: code
    description: Improving coding agents’ core capabilities in requirement clarification, solution planning, program analysis, and issue resolution, using trajectory analysis to identify bottlenecks and guide improvements.
    keywords: Coding agents · Core capabilities · Trajectory analysis
  - title: Reliable Evaluation and Generalization
    icon: search
    description: Evaluating code LLMs and coding agents through human judgments, benchmark contamination analysis, and generalization beyond training distributions, extending from individual development tasks to long-horizon workflows.
    keywords: LLM-as-a-Judge · Generalization · Long-horizon evaluation
  - title: AI for Software Security and Reliability
    icon: shield
    description: Developing AI techniques for vulnerability detection, automated repair, and software quality assurance, combining program context, semantic reasoning, and learning from code.
    keywords: Vulnerability detection · Automated repair · Software reliability

