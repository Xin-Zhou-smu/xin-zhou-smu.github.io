research:
  - title: Agentic Software Engineering
    icon: code
    description: Understanding and improving coding agents for software development, with an emphasis on requirement clarification, planning, program analysis, and issue resolution.
    keywords: Coding agents · Planning · Program analysis
  - title: Reliable Evaluation and Generalization
    icon: search
    description: Developing reliable benchmarks and evaluation methods for code models and agents, with attention to human judgments, benchmark contamination, and generalization across distributions.
    keywords: LLM-as-a-Judge · Benchmarking · Generalization
  - title: AI for Software Security and Reliability
    icon: shield
    description: Developing AI techniques for vulnerability detection, automated repair, and software quality assurance, combining program context, semantic reasoning, and learning from code.
    keywords: Vulnerability detection · Automated repair · Software reliability

